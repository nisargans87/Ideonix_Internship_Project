{% extends 'base.html' %}
{% block content %}
<div>
<h1> Registration </h1>
<h5> Please fill in your details to create an account </h5>
<form method="post" action="/register">
	<label> Name: </label><br>
	<input type="text" name="name" placeholder="Enter your name here..." required> <br><br>
	<label> Email:</label><br>
	<input type="email" name="email" placeholder="Enter your mail here..." required> <br><br>
<label> Password:</label><br>
	<input type="password" name="password" placeholder="Enter your password here..." required> <br><br>
	<button type="Submit"> Register </button>
</form>
</div>
{% endblock %}
